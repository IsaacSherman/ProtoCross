syntax = "proto3";

package protocross.examples;

option csharp_namespace = "ProtoCross.Examples";

// Minimal message used by the ProtoCross examples.
// Behavior for this message lives in simpleScript.pcross.
message InvoiceItem {
  // Items in the invoice
  int64 quantity = 1;

  // cost in cents of each item
  int64 unit_price_cents = 2;

  // name of the item.
  string name = 3;
}

message Invoice{
repeated InvoiceItem items = 1;
}
