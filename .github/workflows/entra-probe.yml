name: entra probe
on:
  push:
    branches: [entra-probe]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: The identity's Azure DevOps profile
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
      - name: Can it publish as isaacsherman?
        run: npx --yes @vscode/vsce@3.9.2 verify-pat --azure-credential isaacsherman