syntax = "proto3";

package protocross.conformance;

// compound_assignment.pcross -- each compound assignment, what its right side is, and how a literal on it is typed.
message CompoundCase {
  int32 narrow = 1;
  int64 wide = 2;
  uint32 narrow_unsigned = 3;
  uint64 wide_unsigned = 4;
  double real = 5;
  float single = 6;
  int32 divisor = 7;
  int32 count = 8;
  repeated int64 amounts = 9;
}
