syntax = "proto3";

// keyword_package.pcross -- a package whose components C++ cannot use as namespace names
// (spec 24.2).
//
// protoc's C++ generator escapes each component of a package on its own, so everything declared
// here lives in ::protocross::conformance::namespace_::private_. C# PascalCases the same components
// into Protocross.Conformance.Namespace.Private, which needs no escaping at all. The last component
// was 'default' until ProtoCross reserved that word for switch (spec 6.4), which made the package's
// full name impossible to write in a ProtoCross source.
package protocross.conformance.namespace.private;

enum PackageLevel {
  PACKAGE_LEVEL_UNSPECIFIED = 0;
  PACKAGE_LEVEL_HIGH = 1;
}

message KeywordPackageCase {
  int64 count = 1;
  PackageLevel level = 2;
  KeywordPackageInner inner = 3;
}

message KeywordPackageInner {
  int64 value = 1;
}
