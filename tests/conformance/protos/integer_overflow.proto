syntax = "proto3";

package protocross.conformance;

// integer_overflow.pcross -- wrapping arithmetic (spec 10.1).
message OverflowCase {
  int32 i32_left = 1;
  int32 i32_right = 2;
  int64 i64_left = 3;
  int64 i64_right = 4;
  uint32 u32_left = 5;
  uint32 u32_right = 6;
  uint64 u64_left = 7;
  uint64 u64_right = 8;
}
