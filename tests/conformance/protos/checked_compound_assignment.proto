syntax = "proto3";

package protocross.conformance;

// checked/checked_compound_assignment.pcross -- compound assignment under the checked overflow policy (spec 10.4).
message CheckedCompoundCase {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  int32 amount = 5;
  int64 divisor = 6;
}
