syntax = "proto2";

package protocross.tests.openness;

// Every proto2 enum is closed (spec 12), whatever it declares. Its values start at 1, as a closed
// enum's may, so zero is a number it does not name.
enum Proto2Status {
  PROTO2_STATUS_IDLE = 1;
  PROTO2_STATUS_BUSY = 2;
}

message Proto2Holder {
  optional Proto2Status status = 1;
  optional int32 number = 2;
  repeated Proto2Status statuses = 3;
}
